# Font
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
font_size        11.0

# Transparency
background_opacity 0.92
background #1a1a2e

# Cursor
cursor #ffffff
cursor_text_color #1a1a2e
cursor_shape beam
cursor_blink_interval 0.5

# Window
window_padding_width 12
hide_window_decorations yes

# Scrollback
scrollback_lines 5000

# Colors - all white text
foreground #ffffff
color0  #1e1e2e
color1  #ffffff
color2  #ffffff
color3  #ffffff
color4  #ffffff
color5  #ffffff
color6  #ffffff
color7  #ffffff
color8  #ffffff
color9  #ffffff
color10 #ffffff
color11 #ffffff
color12 #ffffff
color13 #ffffff
color14 #ffffff
color15 #ffffff

# Misc
enable_audio_bell no
confirm_os_window_close 0
