general {
    col.active_border = rgba(4e444b77)
    col.inactive_border = rgba(1f1a1d33)
}

misc {
    background_color = rgba(161215FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Google Sans Flex Medium, Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(161215FF)
        col.text = rgba(eae0e4FF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(eae0e4), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(eae0e4), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(eae0e4), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrule = border_color rgba(f2b3e6AA) rgba(f2b3e677), match:pin 1
